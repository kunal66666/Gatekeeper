spring.application.name=smart-gateway-service
server.port=8080

info.app.name=Smart Gateway Service
info.app.description=Custom API gateway for routing, security, and traffic management

management.service.url=http://localhost:8081

# Redis Configuration for Distributed Rate Limiting
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka Configuration for Telemetry Streaming
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer